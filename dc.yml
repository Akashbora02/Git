services: 
        studentapp: 
            build: ./studentapp
            ports:
                - "8080:8080" 
        sampledockerfile: 
            build: ./sampledockerfile
            ports:
                - "80:80"
        backend:
          build: ./todo-app/backend
          container_name: backend
          ports:
            - "3001:3001"
          env_file:
            - ./backend/.env
          networks:
            - app-network

        frontend:
          build: ./todo-app/frontend
          container_name: frontend
          ports:
            - "3000:80"
          environment:
            - VITE_API_BASE=http://backend:3001
          networks:
            - app-network
          depends_on:
            - backend

networks:
  app-network: